$schema: https://json-schema.org/draft/2020-12/schema
title: Sky-Forge interaction turn (pending_interaction in journey.yaml)
description: >
  Contrato do bloco pending_interaction gravado em journey.yaml para
  elicitações HITL (AskQuestion / fallback numerado).
type: object
additionalProperties: false
required: [id, status, prompt, options]
properties:
  id:
    type: string
    description: Identificador do ponto (.agents/interaction-points.yaml)
    pattern: '^[a-z][a-z0-9_.]*$'
  status:
    type: string
    enum: [pending, resolved, cleared]
  prompt:
    type: string
    minLength: 1
    maxLength: 500
  options:
    type: array
    minItems: 1
    maxItems: 5
    items:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
          maxLength: 120
        routes_to:
          type: string
        command:
          type: string
  channel:
    type: string
    enum: [ask_question, numbered_chat, cli]
    description: Canal usado na última elicitation
  created_at:
    type: string
    format: date-time
  resolved_at:
    type: [string, 'null']
    format: date-time
  choice_id:
    type: [string, 'null']
  choice_label:
    type: [string, 'null']
  freeform:
    type: [string, 'null']
    description: Texto livre quando o usuário escolheu escape freeform
allOf:
  - if:
      properties:
        status:
          const: resolved
      required: [status]
    then:
      required: [resolved_at]
      anyOf:
        - required: [choice_id]
          properties:
            choice_id:
              type: string
              minLength: 1
        - required: [freeform]
          properties:
            freeform:
              type: string
              minLength: 1
