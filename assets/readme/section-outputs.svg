<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">Outputs e showcase</title>
  <desc id="desc">Pacotes completos fora do repo via SKY_OUTPUTS_DIR; publish sanitiza preview; showcase sobe o site local  ·  privacidade por padrão.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1420"/>
      <stop offset="100%" stop-color="#0E1C28"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="198" rx="19" fill="none" stroke="#2A4A6E"/>
  <rect x="40" y="52" width="6" height="96" rx="3" fill="#3D8F7A"/>

  <text x="68" y="58" fill="#7A90A8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2">DELIVERY</text>
  <text x="68" y="102" fill="#F7F9FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" font-weight="700">Outputs e showcase</text>
  <text x="68" y="148" fill="#A8B8C8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Pacote fora do repo · preview opt-in.</text>

  <g transform="translate(600 28)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="0" y="18" fill="#7A90A8" font-size="14" letter-spacing="1.5">FLUXO</text>

    <rect x="0" y="34" width="118" height="32" rx="8" fill="#122338" stroke="#2A4A6E"/>
    <text x="59" y="55" fill="#A8B8C8" text-anchor="middle">export</text>
    <rect x="128" y="34" width="128" height="32" rx="8" fill="#122338" stroke="#2A4A6E"/>
    <text x="192" y="55" fill="#A8B8C8" text-anchor="middle">publish</text>
    <rect x="266" y="34" width="148" height="32" rx="8" fill="#122338" stroke="#2A4A6E"/>
    <text x="340" y="55" fill="#A8B8C8" text-anchor="middle">showcase</text>

    <text x="0" y="98" fill="#7A90A8" font-size="14" letter-spacing="1.5">PRIVACIDADE</text>
    <rect x="0" y="112" width="530" height="44" rx="10" fill="#122338" stroke="#3D8F7A"/>
    <circle cx="28" cy="134" r="5" fill="#3D8F7A"/>
    <text x="48" y="140" fill="#F7F9FC" font-size="16">SKY_OUTPUTS_DIR · preview só com -Public</text>
  </g>
</svg>
