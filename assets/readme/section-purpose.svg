<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">Propósito Sky</title>
  <desc id="desc">Além de especificar apps, o Sky-Forge conecta a solução a desafios planetários  com permissão  medido por SPI, HCE, GAP, CWB e UXD.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1420"/>
      <stop offset="100%" stop-color="#0E1C28"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="198" rx="19" fill="none" stroke="#2A4A6E"/>
  <rect x="40" y="52" width="6" height="96" rx="3" fill="#3D8F7A"/>

  <text x="68" y="58" fill="#7A90A8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2">ELEVATION</text>
  <text x="68" y="102" fill="#F7F9FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="40" font-weight="700">Propósito Sky</text>
  <text x="68" y="148" fill="#A8B8C8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Especificar e conectar  com permissão.</text>

  <g transform="translate(600 28)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="0" y="18" fill="#7A90A8" font-size="14" letter-spacing="1.5">ENTRADA ’ SAÍDA</text>

    <rect x="0" y="34" width="118" height="32" rx="8" fill="#122338" stroke="#2A4A6E"/>
    <text x="59" y="55" fill="#A8B8C8" text-anchor="middle">conversa</text>
    <rect x="128" y="34" width="78" height="32" rx="8" fill="#122338" stroke="#2A4A6E"/>
    <text x="167" y="55" fill="#A8B8C8" text-anchor="middle">UX</text>
    <rect x="216" y="34" width="128" height="32" rx="8" fill="#122338" stroke="#2A4A6E"/>
    <text x="280" y="55" fill="#A8B8C8" text-anchor="middle">elevator</text>
    <rect x="354" y="34" width="118" height="32" rx="8" fill="#122338" stroke="#2A4A6E"/>
    <text x="413" y="55" fill="#A8B8C8" text-anchor="middle">pipeline</text>

    <text x="0" y="98" fill="#7A90A8" font-size="14" letter-spacing="1.5">ÍNDICES</text>
    <rect x="0" y="112" width="530" height="44" rx="10" fill="#122338" stroke="#3D8F7A"/>
    <circle cx="28" cy="134" r="5" fill="#7EB8D4"/>
    <text x="48" y="140" fill="#F7F9FC" font-size="16">SPI · HCE · GAP · CWB · UXD  abertos e versionados</text>
  </g>
</svg>
