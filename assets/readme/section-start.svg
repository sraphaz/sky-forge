<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">Início rápido</title>
  <desc id="desc">sky.ps1 intake → elevate → export; no Cursor, converse com sky-host ou intake-conductor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1420"/>
      <stop offset="100%" stop-color="#0E1C28"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="198" rx="19" fill="none" stroke="#2A4A6E"/>
  <rect x="40" y="52" width="6" height="96" rx="3" fill="#7EB8D4"/>

  <text x="68" y="58" fill="#7A90A8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2">FIRST ACTION</text>
  <text x="68" y="102" fill="#F7F9FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="40" font-weight="700">Início rápido</text>
  <text x="68" y="148" fill="#A8B8C8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">CLI + sky-host no Cursor.</text>

  <g transform="translate(560 28)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="0" y="18" fill="#7A90A8" font-size="14" letter-spacing="1.5">PASSOS</text>

    <rect x="0" y="34" width="148" height="32" rx="8" fill="#122338" stroke="#2A4A6E"/>
    <text x="74" y="55" fill="#A8B8C8" text-anchor="middle">1 intake</text>
    <rect x="158" y="34" width="158" height="32" rx="8" fill="#122338" stroke="#2A4A6E"/>
    <text x="237" y="55" fill="#A8B8C8" text-anchor="middle">2 elevate</text>
    <rect x="326" y="34" width="148" height="32" rx="8" fill="#122338" stroke="#2A4A6E"/>
    <text x="400" y="55" fill="#A8B8C8" text-anchor="middle">3 export</text>

    <text x="0" y="98" fill="#7A90A8" font-size="14" letter-spacing="1.5">NO CURSOR</text>
    <rect x="0" y="112" width="530" height="44" rx="10" fill="#122338" stroke="#4A7FA8"/>
    <circle cx="28" cy="134" r="5" fill="#7EB8D4"/>
    <text x="48" y="140" fill="#F7F9FC" font-size="16">sky-host · intake-conductor · AGENTS.md</text>
  </g>
</svg>
